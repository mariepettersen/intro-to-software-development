```toml
  [build-system]
  requires = ["setuptools>=64.0", "setuptools_scm>=8"]
  build-backend = "setuptools.build_meta"
  ```

  Then, project / package metadata:

  ```toml
  [project]
  name = "geo-calculator"
  authors = [{ name = "Marie Pettersen" }]
  description = "Introduction to Software Development course and demo Python package"
  readme = "README.md"
  requires-python = ">=3.13"
  license = { file = "LICENSE" }
  dependencies = ["numpy, pytest"]
  dynamic = ["version"]

  [project.urls]
  repository = "https://github.com/mariepettersen/intro-to-software-development"
  ```
